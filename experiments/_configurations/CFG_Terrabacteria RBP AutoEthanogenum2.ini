[GENERAL]
name = "RBP AutoEthanogenum2"
acronym = "RBP-AEthanogenum2"
folder = "RBP_Autoethanogenum2"
type = "single"
#originaldataset = ["Original Input//Terrabacteria//Terrabacteria.embeddings.dataset.csv"]
originaldataset = ["Original Input//Terrabacteria//Terrabacteria.embeddings.dataset.csv","Original Input//Terrabacteria//Clostridium autoethanogenum//Clostridium_autoethanogenum_completeProts.embeddings.dataset.csv","Original Input//Terrabacteria//EColi//Escherichia_coli_strain_K12.embeddings.dataset.csv"]
silentmode = 0

[UNIPROT]
go_ids = ["GO:0003723"]
go_includedescendants = "True"
go_batchsize = -1
go_maxproteinsdownload = -1
go_taxonomies = ["1783272"]
createflag = "no"
go_folder = "Original Input//tmp2"
datasetname = "Terrabacteria"

[UNIPROT-Label_1]
reviewed = ["true"]
annotation = ["manual", "automatic"]

[UNIPROT-Label_0]
reviewed = ["true"]
annotation = ["go"]

[EMBEDDINGS]
model = "prot_t5_xl_half_uniref50-enc"
per_residue = "False"
per_protein = "True"
sec_struct = "False"
sequencebatchsize = 25
createflag = "ask"
cachedataset = ["Original Input//Terrabacteria//Terrabacteria.embeddings.dataset.csv","Original Input//Terrabacteria//EColi//Escherichia_coli_strain_K12.embeddings.csv","Original Input//Terrabacteria//Clostridium autoethanogenum//Clostridium_autoethanogenum_completeProts.embeddings.dataset.csv"]

[ENVIRONMENT]
torchdevice = "mps"
t5secstructfolder = "0.base_T5"

[TRAINTEST]
createflag = "ask"
percent = [0.7, 0.2]
perc_if_ft_overlap = 0.8
_01ratio = "balanced"
includedspecies = ""
excludedspecies = ["Clostridium autoethanogenum","Escherichia coli"]
leaveoneoutspecies = []
trainflag = "ask"
batch_size = [250]
epoch = [350]
learning_rate = [0.0001]
model_name = "RBP_TSTL_small"
model_dir = "models"

[TRAINTEST-Label_0]
annotation = ["go"]
reviewed = ["reviewed"]

[TRAINTEST-Label_1]
annotation = ["automatic"]
reviewed = ["reviewed"]

[VALIDATION]
createflag = "ask"
_01ratio = ["balanced"]
includedspecies = ["Clostridium autoethanogenum","Escherichia coli"]
excludedspecies = []
inferflag = "ask"
input_model = "both"

[VALIDATION-Label]
annotation = ""
reviewed = ""

